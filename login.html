{% extends 'base.html' %}

{% block title %}Student Login — PathWise{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-tech shadow-lg p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="p-3 rounded-circle bg-primary bg-opacity-10 text-primary d-inline-flex mb-2">
                        <i class="bi bi-box-arrow-in-right fs-3"></i>
                    </span>
                    <h3 class="fw-bold mb-1">Student Login</h3>
                    <p class="text-muted small">Access your saved careers, assessment history, and quest badges.</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@student.edu.in" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label small fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary py-2 fw-semibold">Sign In</button>
                    </div>

                    <div class="text-center small text-muted">
                        Don't have an account yet? <a href="{{ url_for('register') }}" class="text-primary fw-semibold">Register here</a>
                    </div>
                </form>

                <div class="mt-4 pt-3 border-top text-center">
                    <small class="text-muted">Or continue exploring as a guest:</small>
                    <div class="mt-2">
                        <a href="{{ url_for('assessment') }}" class="btn btn-outline-secondary btn-sm w-100">
                            <i class="bi bi-person me-1"></i> Continue as Guest Student
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
